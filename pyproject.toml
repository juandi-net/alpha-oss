[project]
name = "alpha"
version = "0.1.0"
description = "Pulls alpha from X, GitHub, Hugging Face, Substack, and papers, keeps only real signal, and turns it into suggestions, agent skills, and an MCP server for your AI agents."
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.4.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
    "trafilatura>=2.3.1",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
alpha = "alpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Ruff's default rules, but three that do not fit this codebase: I001 (it cannot wrap imports in the compact grid used
# here), SIM905 (word lists are written as one split string so they stay readable), and SIM118 (rows are sqlite3.Row,
# where `name in row` tests the values, not the column names: `in row.keys()` is the correct test).
ignore = ["I001", "SIM905", "SIM118"]
